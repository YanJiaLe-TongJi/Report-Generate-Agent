version: "3.9"

services:
  report-app:
    build: .
    container_name: report-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      API_KEY_ENCRYPTION_KEY: "${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}"
      DATABASE_URL: "sqlite:////app/instance/app.db"
      TEXLIVE_ROOT: "/usr/share/texlive"
      FLASK_DEBUG: "${FLASK_DEBUG:-false}"
      FILE_CLEANUP_TTL_SECONDS: "${FILE_CLEANUP_TTL_SECONDS:-600}"
      FILE_CLEANUP_INTERVAL_SECONDS: "${FILE_CLEANUP_INTERVAL_SECONDS:-60}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      SMTP_SERVER: "${SMTP_SERVER:-smtp.qq.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SITE_LOGO_PATH: "${SITE_LOGO_PATH:-}"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./instance:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
