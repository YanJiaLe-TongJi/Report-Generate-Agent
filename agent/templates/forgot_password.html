<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 - 物理实验报告生成器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --primary:#2563eb;--primary-hover:#1d4ed8;
  --success:#16a34a;--error:#dc2626;--amber:#d97706;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;font-weight:600;color:var(--primary)}
.logo p{font-size:13px;color:var(--text2);margin-top:4px}
h2{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center}
.step-indicator{display:flex;justify-content:center;gap:16px;margin-bottom:24px}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3)}
.step.active{color:var(--primary);font-weight:500}
.step-number{width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.step.active .step-number{background:var(--primary);color:#fff}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
input[type=email],input[type=password],input[type=text]{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;outline:none;transition:border-color .2s;background:#fff;color:var(--text)
}
input:focus{border-color:var(--primary)}
input:disabled{background:#f1f5f9;cursor:not-allowed}
.btn{
  display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:500;
  cursor:pointer;transition:all .2s;text-align:center;text-decoration:none;margin-top:20px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{
  background:none;border:1px solid var(--border);color:var(--text);
  padding:10px 16px;font-size:13px;width:auto;white-space:nowrap;
}
.btn-outline:hover:not(:disabled){background:var(--bg)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed;background:none}
.btn-outline.sending{background:#f0f5ff;border-color:var(--primary);color:var(--primary)}
.code-input-group{display:flex;gap:10px;align-items:stretch}
.code-input-group input{flex:1}
.code-input-group .btn{margin-top:0;align-self:stretch;display:flex;align-items:center;justify-content:center}
.links{text-align:center;margin-top:16px;font-size:13px;color:var(--text2)}
.links a{color:var(--primary);text-decoration:none}
.links a:hover{text-decoration:underline}
.error-message{background:#fef2f2;color:var(--error);padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;border:1px solid #fecaca}
.success-message{background:#f0fdf4;color:var(--success);padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;border:1px solid #bbf7d0}
.info-message{background:#eff6ff;color:var(--primary);padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;border:1px solid #dbeafe}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.requirement{font-size:12px;color:var(--text2);margin-top:4px}
.requirement.met{color:var(--success)}
.email-display{background:#f8fafc;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text);margin-bottom:16px;border:1px solid var(--border)}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">
      <h1>📚 物理实验报告生成器</h1>
      <p>同济大学物理实验中心</p>
    </div>

    <h2>找回密码</h2>

    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step active" id="step1">
        <span class="step-number">1</span>
        <span>验证邮箱</span>
      </div>
      <div class="step" id="step2">
        <span class="step-number">2</span>
        <span>重置密码</span>
      </div>
    </div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="success-message">{{ success }}</div>
    {% endif %}

    <!-- Step 1: Request Code -->
    <div id="requestStep">
      <form method="POST" action="{{ url_for('forgot_password') }}" id="requestForm">
        <input type="hidden" name="step" value="request">

        <div class="form-group">
          <label for="email">注册邮箱</label>
          <input type="email" id="email" name="email" placeholder="yourname@tongji.edu.cn" required autofocus
                 value="{{ email if email else '' }}">
          <div class="hint">请输入您注册时使用的同济大学邮箱</div>
        </div>

        <div class="form-group">
          <label for="verification_code">验证码</label>
          <div class="code-input-group">
            <input type="text" id="verification_code" name="verification_code" placeholder="6位数字验证码" required maxlength="6" pattern="[0-9]{6}">
            <button type="button" class="btn btn-outline" id="sendCodeBtn">获取验证码</button>
          </div>
          <div class="hint" id="codeHint">点击获取验证码，将发送至您的邮箱</div>
        </div>

        <button type="submit" class="btn btn-primary" id="verifyBtn">验证并继续</button>
      </form>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="resetStep" class="hidden">
      {% if email %}
      <div class="info-message">正在为邮箱 <strong>{{ email }}</strong> 重置密码</div>
      {% endif %}

      <form method="POST" action="{{ url_for('forgot_password') }}" id="resetForm">
        <input type="hidden" name="email" id="resetEmail" value="{{ email if email else '' }}">
        <input type="hidden" name="verification_code" id="resetCode" value="{{ verification_code if verification_code else '' }}">

        <div class="form-group">
          <label for="new_password">新密码</label>
          <input type="password" id="new_password" name="new_password" placeholder="设置新密码" required minlength="6">
          <div class="requirement" id="pwdLength">密码长度至少6位</div>
        </div>

        <div class="form-group">
          <label for="password_confirm">确认新密码</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="再次输入新密码" required>
          <div class="requirement" id="pwdMatch">两次输入的密码需要一致</div>
        </div>

        <button type="submit" class="btn btn-primary">重置密码</button>
      </form>
    </div>

    <div class="links">
      <a href="{{ url_for('login') }}">返回登录</a>
      &nbsp;|&nbsp;
      <a href="{{ url_for('register') }}">注册新账号</a>
    </div>
  </div>
</div>

<script>
// Server-side state
const serverEmail = "{{ email if email else '' }}";
const serverVerified = {{ 'true' if verified else 'false' }};

// DOM elements
const requestStep = document.getElementById('requestStep');
const resetStep = document.getElementById('resetStep');
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');

// If already verified (from server), show reset step
if (serverEmail && serverVerified) {
  requestStep.classList.add('hidden');
  resetStep.classList.remove('hidden');
  step1.classList.remove('active');
  step2.classList.add('active');
}

// Request form validation
document.getElementById('requestForm').addEventListener('submit', function(e) {
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('verification_code').value.trim();

  if (!email.endsWith('@tongji.edu.cn')) {
    e.preventDefault();
    alert('仅接受同济大学邮箱(@tongji.edu.cn)');
    return false;
  }

  if (!/^\d{6}$/.test(code)) {
    e.preventDefault();
    alert('请输入6位数字验证码');
    return false;
  }

  return true;
});

// Reset form validation
document.getElementById('resetForm').addEventListener('submit', function(e) {
  const password = document.getElementById('new_password').value;
  const confirm = document.getElementById('password_confirm').value;

  if (password.length < 6) {
    e.preventDefault();
    alert('密码长度至少6位');
    return false;
  }

  if (password !== confirm) {
    e.preventDefault();
    alert('两次输入的密码不一致');
    return false;
  }

  return true;
});

// Send verification code
const sendBtn = document.getElementById('sendCodeBtn');
const codeHint = document.getElementById('codeHint');
let countdown = 0;
let countdownTimer = null;

sendBtn.addEventListener('click', async function() {
  const email = document.getElementById('email').value.trim();

  // Validate email
  if (!email) {
    alert('请先输入邮箱地址');
    document.getElementById('email').focus();
    return;
  }

  if (!email.endsWith('@tongji.edu.cn')) {
    alert('仅接受同济大学邮箱(@tongji.edu.cn)');
    document.getElementById('email').focus();
    return;
  }

  // Disable button during request
  sendBtn.disabled = true;
  const originalText = sendBtn.textContent;
  sendBtn.textContent = '发送中...';

  try {
    const response = await fetch('{{ url_for("send_verification_code") }}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        email: email,
        purpose: 'reset_password'
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      // Start countdown
      countdown = 60;
      startCountdown();
      codeHint.textContent = '验证码已发送至 ' + email + '，请查收邮件';
      codeHint.style.color = 'var(--success)';
      document.getElementById('verification_code').focus();

      // Update hidden fields in reset form
      document.getElementById('resetEmail').value = email;
      document.getElementById('resetCode').value = document.getElementById('verification_code').value;
    } else {
      alert(data.error || '发送失败，请稍后重试');
      sendBtn.disabled = false;
      sendBtn.textContent = originalText;
    }
  } catch (error) {
    alert('网络错误，请检查网络连接');
    sendBtn.disabled = false;
    sendBtn.textContent = originalText;
  }
});

function startCountdown() {
  if (countdownTimer) {
    clearInterval(countdownTimer);
  }

  sendBtn.classList.add('sending');

  countdownTimer = setInterval(function() {
    if (countdown > 0) {
      sendBtn.textContent = countdown + '秒后重试';
      countdown--;
    } else {
      clearInterval(countdownTimer);
      sendBtn.disabled = false;
      sendBtn.textContent = '获取验证码';
      sendBtn.classList.remove('sending');
    }
  }, 1000);
}

// Real-time password validation
document.getElementById('new_password').addEventListener('input', function() {
  const lengthReq = document.getElementById('pwdLength');
  if (this.value.length >= 6) {
    lengthReq.classList.add('met');
    lengthReq.textContent = '✓ 密码长度符合要求';
  } else {
    lengthReq.classList.remove('met');
    lengthReq.textContent = '密码长度至少6位';
  }
});

document.getElementById('password_confirm').addEventListener('input', function() {
  const matchReq = document.getElementById('pwdMatch');
  const password = document.getElementById('new_password').value;
  if (this.value === password && this.value !== '') {
    matchReq.classList.add('met');
    matchReq.textContent = '✓ 两次输入一致';
  } else {
    matchReq.classList.remove('met');
    matchReq.textContent = '两次输入的密码需要一致';
  }
});

// Email validation for code button
document.getElementById('email').addEventListener('input', function() {
  const codeHint = document.getElementById('codeHint');
  const email = this.value.trim();

  if (email && !email.endsWith('@tongji.edu.cn')) {
    codeHint.textContent = '仅接受 @tongji.edu.cn 邮箱';
    codeHint.style.color = 'var(--error)';
  } else {
    codeHint.textContent = '点击获取验证码，将发送至您的邮箱';
    codeHint.style.color = 'var(--text3)';
  }
});
</script>
</body>
</html>
