<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统维护中</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(760px, 92vw);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
    }
    .period {
      margin: 0 0 16px;
      font-size: 14px;
      color: #4b5563;
    }
    .content {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 15px;
      color: #111827;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 14px;
      text-decoration: none;
      color: #111827;
      font-size: 14px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">系统维护通知</div>
    <h1>{{ maintenance.title or '系统维护中' }}</h1>
    <p class="period">
      维护时间：
      {{ maintenance.start_at or '立即开始' }}
      ~
      {{ maintenance.end_at or '待维护结束' }}
    </p>
    <div class="content">{{ maintenance.content or '系统正在维护升级中，请稍后再试。' }}</div>
    <div class="actions">
      <a class="btn" href="/logout">退出登录</a>
    </div>
  </div>
</body>
</html>
